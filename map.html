<!DOCTYPE html>
<html>

<head>
    <title>Leaflet + GeoServer WMS + WFS Highlight (UI Redesign)</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="map.css" />

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>

<body>
    <div class="sidebar" id="sidebar">
        <button class="sidebar-logo-btn" title="Logo / Current" tabindex="0">
            <svg viewBox="0 0 24 24">
                <polygon points="12,4 15,16 12,13 9,16" />
            </svg>
        </button>
        <button class="sidebar-btn active" title="Map" data-btn="map" tabindex="0">
            <svg viewBox="0 0 28 28">
                <rect x="3.5" y="7" width="6" height="14" rx="1.2" />
                <rect x="11.5" y="5" width="6" height="16" rx="1.2" />
                <rect x="19.5" y="9" width="5" height="12" rx="1.2" />
            </svg>
        </button>
        <button class="sidebar-btn" title="Pin map" data-btn="pin" id="btnPin" tabindex="0">
            <svg viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round" class="feather feather-tag">
                <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"></path>
                <line x1="7" y1="7" x2="7.01" y2="7"></line>
            </svg>
        </button>
        <button class="sidebar-btn" title="Folder" data-btn="folder" id="folderBtn" tabindex="0">
            <svg viewBox="0 0 28 28">
                <path d="M4 10v8.5a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V10a2 2 0 0 0-2-2h-6.5l-2-3H6a2 2 0 0 0-2 2z" />
            </svg>
        </button>
        <button class="sidebar-btn" title="Grid" data-btn="grid" tabindex="0">
            <svg viewBox="0 0 28 28">
                <rect x="4.5" y="5.5" width="6" height="6" rx="1.2" />
                <rect x="4.5" y="16.5" width="6" height="6" rx="1.2" />
                <rect x="15.5" y="5.5" width="6" height="6" rx="1.2" />
                <rect x="15.5" y="16.5" width="6" height="6" rx="1.2" />
            </svg>
        </button>
        <button class="sidebar-btn" title="Book" data-btn="book" tabindex="0">
            <svg viewBox="0 0 28 28">
                <rect x="5" y="6" width="8.5" height="16" rx="1.2" />
                <rect x="14.5" y="6" width="8.5" height="16" rx="1.2" />
            </svg>
        </button>
        <button class="sidebar-btn" title="Flag" data-btn="flag" tabindex="0">
            <svg viewBox="0 0 28 28">
                <path d="M7 22V6m0 0h8l2 4h4v8h-8l-2-4H7" />
            </svg>
        </button>
        <div class="sidebar-bottom">
            <button class="sidebar-btn" title="Settings" data-btn="settings" id="btnSettings" tabindex="0">
                <svg viewBox="0 0 28 28">
                    <svg viewBox="0 0 28 28">
                        <path
                            d="M20.017 14.669L23 13.564l-.012-3.208-2.996-1.085a8.455 8.455 0 0 0-.437-1.05l1.329-2.893-2.277-2.26-2.886 1.351a8.396 8.396 0 0 0-1.052-.436L13.564 1l-3.208.012-1.085 2.996a8.485 8.485 0 0 0-1.05.437L5.328 3.116l-2.26 2.276L4.419 8.28a8.378 8.378 0 0 0-.436 1.052L1 10.436l.012 3.208 2.996 1.085a8.46 8.46 0 0 0 .437 1.05l-1.329 2.893 2.276 2.26 2.887-1.351a8.383 8.383 0 0 0 1.052.436L10.436 23l3.208-.012 1.085-2.996a8.478 8.478 0 0 0 1.05-.437l2.893 1.329 2.26-2.276-1.351-2.887a8.382 8.382 0 0 0 .436-1.052zm-.287 3.73l-1.275 1.285-2.694-1.238-.429.215a7.612 7.612 0 0 1-.928.385l-.452.156-1.01 2.789-1.81.007-1.03-2.779-.456-.151a7.394 7.394 0 0 1-.926-.385l-.43-.21-2.688 1.257-1.286-1.275 1.239-2.695-.216-.43a7.551 7.551 0 0 1-.386-.926l-.155-.452-2.79-1.01-.005-1.81 2.777-1.03.152-.456a7.46 7.46 0 0 1 .384-.927l.212-.43L4.27 5.601l1.275-1.285 2.694 1.238.429-.215a7.612 7.612 0 0 1 .928-.385l.452-.156 1.01-2.789 1.81-.007 1.03 2.779.456.151a7.35 7.35 0 0 1 .925.385l.43.211L18.4 4.27l1.285 1.275-1.239 2.695.216.43a7.551 7.551 0 0 1 .386.926l.155.452 2.79 1.01.005 1.81-2.777 1.03-.152.456a7.46 7.46 0 0 1-.384.927l-.212.43zM12 7.2a4.8 4.8 0 1 0 4.8 4.8A4.8 4.8 0 0 0 12 7.2zm0 8.6a3.8 3.8 0 1 1 3.8-3.8 3.804 3.804 0 0 1-3.8 3.8z"
                            stroke-width="1" />
                    </svg>
            </button>
        </div>
    </div>

    <div class="folder-popup" id="folderPopup">
        <h3>Это пример кастомного виджета</h3>
        <p>Это рабочая область виджета или кабинета пользователя.</p>
    </div>

    <div class="custom-controls" id="customControls">
        <button class="custom-fullscreen-btn" id="fullscreenBtn" title="Fullscreen" tabindex="0">
            <svg viewBox="0 0 28 28">
                <polyline points="5,12 5,5 12,5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <polyline points="23,12 23,5 16,5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <polyline points="23,16 23,23 16,23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                <polyline points="5,16 5,23 12,23" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
        <div class="custom-zoom" id="customZoom">
            <button class="custom-zoom-btn" id="zoom-in" title="Zoom in">
                <svg viewBox="0 0 28 28">
                    <line x1="14" y1="8" x2="14" y2="20" stroke-width="2" stroke-linecap="round" />
                    <line x1="8" y1="14" x2="20" y2="14" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <button class="custom-zoom-btn" id="zoom-out" title="Zoom out">
                <svg viewBox="0 0 28 28">
                    <line x1="8" y1="14" x2="20" y2="14" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
        </div>
        <div class="custom-layer-control-group">
            <button class="custom-layer-btn" id="customLayerBtn" title="Слои" tabindex="0">
                <svg viewBox="0 0 28 28">
                    <line x1="7" y1="8" x2="21" y2="8" stroke-width="2" stroke-linecap="round" />
                    <line x1="7" y1="14" x2="21" y2="14" stroke-width="1.4" stroke-linecap="round" />
                    <line x1="7" y1="20" x2="21" y2="20" stroke-width="2" stroke-linecap="round" />
                </svg>
            </button>
            <div class="custom-layer-control" id="customLayerControl"></div>
        </div>
    </div>
    <div id="map">
        <!-- Если контейнер карты у тебя, например, <div id="map"></div>, то лучше добавить settingsPopup внутри этого контейнера, чтобы позиционирование с position: absolute работало относительно карты -->
        <div id="settingsPopup">
            <h3>Настройки карты</h3>
            <p>Здесь будет форма или любые элементы управления.</p>
        </div>

    </div>

    <script src="map.js"></script>
</body>

</html>
